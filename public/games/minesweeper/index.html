<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #102957;
      }

      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: relative !important;
        inset: auto !important;
        transform: none !important;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #102957;
      }

      #unity-canvas,
      #unity-canvas.unity-mobile {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #102957;
      }

      #unity-footer {
        display: none !important;
      }

      #unity-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      #unity-warning {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
      }
    </style>
  </head>

  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        const warningBanner = document.querySelector("#unity-warning");

        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length
            ? "block"
            : "none";
        }

        const div = document.createElement("div");
        div.textContent = msg;

        warningBanner.appendChild(div);

        if (type === "error") {
          div.style.cssText = "background: red; padding: 10px;";
        } else {
          if (type === "warning") {
            div.style.cssText = "background: yellow; padding: 10px;";
          }

          setTimeout(() => {
            div.remove();
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      const buildUrl = "Build";

      const loaderUrl = buildUrl + "/MinesweeperWebBuild.loader.js";

      const config = {
        arguments: [],
        dataUrl: buildUrl + "/MinesweeperWebBuild.data",
        frameworkUrl: buildUrl + "/MinesweeperWebBuild.framework.js",
        codeUrl: buildUrl + "/MinesweeperWebBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MinesweeperWebGL",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Unity automatically matches its rendering
      // resolution to the canvas display dimensions.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";

        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      const script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width =
            100 * progress + "%";
        })
          .then(() => {
            document.querySelector("#unity-loading-bar").style.display = "none";
          })
          .catch((message) => {
            unityShowBanner(message, "error");
            document.querySelector("#unity-loading-bar").style.display = "none";
          });
      };

      script.onerror = () => {
        unityShowBanner("Failed to load the Unity game.", "error");
        document.querySelector("#unity-loading-bar").style.display = "none";
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
